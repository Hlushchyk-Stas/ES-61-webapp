<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Тест зв'язку Mini App + Сервер</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color, #111827);
      color: var(--tg-theme-text-color, #f9fafb);
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #1f2937);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      opacity: 0.85;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #4b5563;
      background: #111827;
      color: #f9fafb;
      margin-bottom: 10px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--tg-theme-button-color, #2563eb);
      color: var(--tg-theme-button-text-color, #ffffff);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    pre {
      background: #0b1020;
      color: #a7f3d0;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3 style="margin-top:0;">1. Дані з Telegram</h3>
    <div id="tg-user">Перевірка середовища Telegram...</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">2. Тест зв'язку із сервером</h3>
    <label for="serverUrl">HTTPS URL вашого сервера:</label>
    <input id="serverUrl" type="url" value="https://bond-journalists-diffs-crossing.trycloudflare.com" placeholder="https://example.trycloudflare.com" />

    <label for="note">Тестове повідомлення на сервер:</label>
    <input id="note" type="text" value="Привіт з Telegram Mini App!" />

    <button id="btnPing">Перевірити /api/ping</button>
    <button id="btnVerify">Надіслати initData на /api/verify</button>
  </div>

  <div class="card">
    <h3 style="margin-top:0;">Відповідь сервера</h3>
    <pre id="output">Натисніть кнопку вище...</pre>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const userEl = document.getElementById("tg-user");
    const serverUrlInput = document.getElementById("serverUrl");
    const noteInput = document.getElementById("note");
    const outputEl = document.getElementById("output");

    const savedUrl = localStorage.getItem("miniapp_test_server_url");
    if (savedUrl) serverUrlInput.value = savedUrl;

    const user = tg?.initDataUnsafe?.user;
    if (user) {
      userEl.innerText = `Користувач: ${user.first_name || ""} ${user.last_name || ""} (@${user.username || "без_ніка"}, ID: ${user.id})`;
    } else {
      userEl.innerText = "Відкрито у звичайному браузері (не через Telegram) — initData буде порожнім.";
    }

    function getBaseUrl() {
      const url = serverUrlInput.value.trim().replace(/\/+$/, "");
      if (!url) {
        outputEl.textContent = "Спочатку введіть HTTPS URL сервера.";
        return null;
      }
      localStorage.setItem("miniapp_test_server_url", url);
      return url;
    }

    document.getElementById("btnPing").onclick = async () => {
      const base = getBaseUrl();
      if (!base) return;
      outputEl.textContent = "Запит GET /api/ping...";
      try {
        const res = await fetch(`${base}/api/ping`);
        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = "Помилка з'єднання: " + err.message;
      }
    };

    document.getElementById("btnVerify").onclick = async () => {
      const base = getBaseUrl();
      if (!base) return;
      outputEl.textContent = "Запит POST /api/verify...";
      try {
        const res = await fetch(`${base}/api/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            initData: tg?.initData || "",
            note: noteInput.value,
          }),
        });
        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = "Помилка з'єднання: " + err.message;
      }
    };
  </script>
</body>
</html>
